[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-flipped-models"
version = "0.1.0"
description = "SpecQ-Hamiltonian: Spectral Interaction Selection in Flipped Quantum Subspace-Informed Models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Evoth Labs"}
]

dependencies = ["torch>=2.0", "pennylane>=0.35", "numpy", "scikit-learn", "pandas", "hydra-core==1.3.2", "omegaconf", "matplotlib", "seaborn", "tqdm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
