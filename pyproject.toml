[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-flipped-models"
version = "0.1.0"
description = "SpecQ-Hamiltonian: Spectral Interaction Selection in Flipped Quantum Subspace-Informed Models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Evoth Labs" }]

# Every entry below is imported somewhere in src/ or experiments/.
#   scipy       -> src/generators/qmi_pauli_generator.py
#   seaborn     -> src/analysis/analyze_pauli_geometry.py, experiments/experiment_stability_validation.py
#   hydra-core  -> src/utils/seeds.py, experiments/experiment_mnist.py, test_hydra.py
# scipy and seaborn were previously required but undeclared; tqdm was declared but
# is imported nowhere, and has been dropped.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "torch>=2.0",
    "pennylane>=0.35",
    "hydra-core==1.3.2",
    "omegaconf",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "experiments", "experiments.*"]
