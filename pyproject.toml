[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-flipped-models"
version = "0.1.0"
description = "SpecQ-Hamiltonian: Spectral Interaction Selection in Flipped Quantum Subspace-Informed Models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Evoth Labs" }]

# Every entry below is imported somewhere in src/ or experiments/.
#   scipy    -> src/generators/qmi_pauli_generator.py
#   seaborn  -> src/analysis/analyze_pauli_geometry.py, experiments/experiment_stability_validation.py
# hydra-core, omegaconf and tqdm were previously declared but are imported nowhere,
# and scipy/seaborn were missing despite being required. Both fixed.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "torch>=2.0",
    "pennylane>=0.35",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "experiments", "experiments.*"]
